<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker</title>
<style>
  /* ── Reset & Base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f4f0;
    --surface:   #ffffff;
    --surface2:  #f0ede8;
    --border:    #e2ddd8;
    --border2:   #ccc8c2;
    --accent:    #2d6a4f;
    --accent-lt: #d8ede4;
    --accent-dk: #1b4332;
    --warn:      #c0392b;
    --warn-lt:   #fdecea;
    --amber:     #b7791f;
    --amber-lt:  #fef3c7;
    --text:      #1a1a1a;
    --text2:     #5a5a5a;
    --text3:     #9a9a9a;
    --radius:    8px;
    --radius-lg: 12px;
    --shadow:    0 1px 4px rgba(0,0,0,.07);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  .app-wrap {
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text);
  }
  header h1 span { color: var(--accent); }
  #header-date {
    font-size: 0.82rem;
    color: var(--text3);
    margin-top: 3px;
    letter-spacing: 0.2px;
  }

  /* ── Section heading ──────────────────────────────────────── */
  .section-heading {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 10px;
  }

  /* ── Add Habit ────────────────────────────────────────────── */
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  .add-row input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color .15s;
  }
  .add-row input::placeholder { color: var(--text3); }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, transform .1s;
  }
  .add-row button:hover  { background: var(--accent-dk); }
  .add-row button:active { transform: scale(0.97); }

  /* ── Stats Bar ────────────────────────────────────────────── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .val {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat-card .lbl {
    font-size: 0.73rem;
    color: var(--text3);
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* ── Today's Habits ───────────────────────────────────────── */
  .habits-section { margin-bottom: 28px; }
  .habit-list { display: flex; flex-direction: column; gap: 7px; }
  .habit-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, background .15s;
    box-shadow: var(--shadow);
  }
  .habit-item:hover { border-color: var(--border2); }
  .habit-item.done {
    background: var(--accent-lt);
    border-color: #a8d5c0;
  }
  .habit-item .checkbox {
    width: 20px; height: 20px; min-width: 20px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: transparent;
    transition: all .15s;
    flex-shrink: 0;
  }
  .habit-item.done .checkbox {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .habit-item .habit-name {
    flex: 1;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
    word-break: break-word;
  }
  .habit-item.done .habit-name {
    color: var(--text2);
    text-decoration: line-through;
    text-decoration-color: var(--text3);
  }
  .habit-item .streak-badge {
    font-size: 0.72rem;
    font-weight: 600;
    background: var(--amber-lt);
    color: var(--amber);
    border: 1px solid #f6d98a;
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .habit-item.done .streak-badge {
    background: rgba(255,255,255,0.6);
    border-color: #a8d5c0;
    color: var(--accent-dk);
  }
  .del-btn {
    width: 26px; height: 26px; min-width: 26px;
    border-radius: 50%;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text3);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
  }
  .del-btn:hover {
    background: var(--warn-lt);
    border-color: #f5bcb8;
    color: var(--warn);
  }

  /* ── Empty State ──────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 36px 20px;
    border: 1px dashed var(--border2);
    border-radius: var(--radius-lg);
    color: var(--text3);
  }
  .empty-state .empty-icon { font-size: 2rem; margin-bottom: 10px; }
  .empty-state p { font-size: 0.88rem; }

  /* ── Tracking Tabs ────────────────────────────────────────── */
  .tracking-section { margin-bottom: 28px; }
  .tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tab-btn {
    padding: 6px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tab-btn:hover:not(.active) {
    border-color: var(--border2);
    color: var(--text);
  }

  /* ── Calendar Grid ────────────────────────────────────────── */
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .cal-head {
    text-align: center;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text3);
    padding: 4px 0 6px;
    letter-spacing: 0.4px;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 0.8rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-weight: 500;
    transition: all .1s;
    position: relative;
  }
  .cal-cell.off-month {
    background: transparent;
    border-color: transparent;
    color: var(--border2);
  }
  .cal-cell.today {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .cal-cell.all-done {
    background: var(--accent-lt);
    border-color: #a8d5c0;
    color: var(--accent-dk);
    font-weight: 600;
  }
  .cal-cell.partial {
    background: var(--amber-lt);
    border-color: #f6d98a;
    color: var(--amber);
    font-weight: 600;
  }

  /* ── All Habits Panel ─────────────────────────────────────── */
  .all-habits-section { margin-bottom: 12px; }
  .all-habit-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 7px;
    box-shadow: var(--shadow);
  }
  .all-habit-row .name {
    flex: 1;
    font-size: 0.9rem;
    color: var(--text2);
    font-weight: 500;
    word-break: break-word;
  }
  .all-habit-row .streak-info {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Toast ────────────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 0.83rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Footer ───────────────────────────────────────────────── */
  footer {
    text-align: center;
    padding: 16px;
    font-size: 0.78rem;
    color: var(--text3);
    border-top: 1px solid var(--border);
    margin-top: auto;
  }

  /* ── Mobile ───────────────────────────────────────────────── */
  @media (max-width: 480px) {
    header h1 { font-size: 1.3rem; }
    .stats-bar { grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .stat-card .val { font-size: 1.4rem; }
    .add-row { flex-direction: column; }
    .add-row button { width: 100%; }
    .cal-cell { font-size: 0.72rem; }
  }
</style>
</head>
<body>

<div class="app-wrap">

  <!-- Header -->
  <header>
    <h1>&#128200; Habit <span>Tracker</span></h1>
    <div id="header-date"></div>
  </header>

  <!-- Add Habit -->
  <div class="add-row">
    <input
      type="text"
      id="habit-input"
      placeholder="New habit name (e.g. Read, Exercise, Meditate)"
      autocomplete="off"
      maxlength="60"
    >
    <button id="add-btn">+ Add Habit</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="stats-bar"></div>

  <!-- Today's Habits -->
  <div class="habits-section">
    <div class="section-heading">Today's Habits</div>
    <div class="habit-list" id="today-list"></div>
  </div>

  <!-- Tracking -->
  <div class="tracking-section">
    <div class="section-heading">Tracking</div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="weekly"  onclick="switchTab('weekly',  this)">Weekly</button>
      <button class="tab-btn"        data-tab="monthly" onclick="switchTab('monthly', this)">Monthly</button>
    </div>
    <div id="cal-view"></div>
  </div>

  <!-- All Habits + Streaks -->
  <div class="all-habits-section">
    <div class="section-heading">All Habits &amp; Streaks</div>
    <div id="all-list"></div>
  </div>

</div><!-- /.app-wrap -->

<!-- Toast -->
<div id="toast"></div>

<!-- Footer -->
<footer>Created by Aabid Gulzar</footer>

<script>
/* ══════════════════════════════════════════════════════════════
   HABIT TRACKER — pure HTML/CSS/JS, localStorage persistence
   ══════════════════════════════════════════════════════════════ */

// ── Storage keys ─────────────────────────────────────────────
var STORAGE_HABITS      = 'ht_habits_v1';
var STORAGE_COMPLETIONS = 'ht_completions_v1';

// ── Active calendar tab ───────────────────────────────────────
var activeTab = 'weekly';

// ── Load from localStorage ────────────────────────────────────
function loadHabits() {
  try {
    var raw = localStorage.getItem(STORAGE_HABITS);
    var data = raw ? JSON.parse(raw) : [];
    // Validate: must be an array of {id, name, createdDate}
    if (!Array.isArray(data)) return [];
    return data.filter(function(h) {
      return h && typeof h.id === 'string' && typeof h.name === 'string' && h.name.trim() !== '';
    });
  } catch(e) {
    return [];
  }
}

function saveHabits(habits) {
  localStorage.setItem(STORAGE_HABITS, JSON.stringify(habits));
}

function loadCompletions() {
  try {
    var raw = localStorage.getItem(STORAGE_COMPLETIONS);
    var data = raw ? JSON.parse(raw) : {};
    // Validate: must be an object where values are arrays of strings
    if (typeof data !== 'object' || Array.isArray(data) || data === null) return {};
    var clean = {};
    Object.keys(data).forEach(function(dateStr) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr) && Array.isArray(data[dateStr])) {
        clean[dateStr] = data[dateStr].filter(function(id) { return typeof id === 'string'; });
      }
    });
    return clean;
  } catch(e) {
    return {};
  }
}

function saveCompletions(completions) {
  localStorage.setItem(STORAGE_COMPLETIONS, JSON.stringify(completions));
}

// ── Date helpers ──────────────────────────────────────────────
function dateToStr(date) {
  var y = date.getFullYear();
  var m = String(date.getMonth() + 1).padStart(2, '0');
  var d = String(date.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}

function todayStr() {
  return dateToStr(new Date());
}

function dateOffset(offsetDays) {
  var d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d;
}

function formatFull(date) {
  var opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  return date.toLocaleDateString('en-US', opts);
}

// ── Streak calculation ────────────────────────────────────────
function calcStreak(habitId, completions) {
  var streak = 0;
  var cur = new Date();
  // Allow today as part of streak even if not yet checked
  for (var i = 0; i <= 365; i++) {
    var d = new Date(cur);
    d.setDate(cur.getDate() - i);
    var ds = dateToStr(d);
    var dayIds = completions[ds] || [];
    if (dayIds.indexOf(habitId) > -1) {
      streak++;
    } else {
      // If day 0 (today) is not done, that's fine — keep looking
      // If day >= 1 is broken, stop
      if (i > 0) break;
    }
  }
  return streak;
}

// ── XSS-safe text ─────────────────────────────────────────────
function escHtml(str) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

// ── Toast notification ─────────────────────────────────────────
var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2200);
}

// ── Add Habit ──────────────────────────────────────────────────
function addHabit() {
  var input = document.getElementById('habit-input');
  var name  = input.value.trim();

  if (!name) {
    showToast('Please enter a habit name.');
    input.focus();
    return;
  }

  if (name.length > 60) {
    showToast('Name too long (max 60 characters).');
    return;
  }

  var habits = loadHabits();

  // Duplicate check (case-insensitive)
  var duplicate = habits.some(function(h) {
    return h.name.toLowerCase() === name.toLowerCase();
  });
  if (duplicate) {
    showToast('This habit already exists.');
    input.value = '';
    input.focus();
    return;
  }

  var newHabit = {
    id:          Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name:        name,
    createdDate: todayStr()
  };

  habits.push(newHabit);
  saveHabits(habits);
  input.value = '';
  input.focus();
  render();
  showToast('Habit added!');
}

// ── Delete Habit ───────────────────────────────────────────────
function deleteHabit(habitId) {
  if (!confirm('Delete this habit? All its data will be removed.')) return;

  var habits = loadHabits().filter(function(h) { return h.id !== habitId; });
  saveHabits(habits);

  // Remove from completions too
  var completions = loadCompletions();
  Object.keys(completions).forEach(function(ds) {
    completions[ds] = completions[ds].filter(function(id) { return id !== habitId; });
    if (completions[ds].length === 0) delete completions[ds];
  });
  saveCompletions(completions);

  render();
  showToast('Habit removed.');
}

// ── Toggle Completion ──────────────────────────────────────────
function toggleCompletion(habitId) {
  var completions = loadCompletions();
  var today       = todayStr();

  if (!completions[today]) completions[today] = [];

  var idx = completions[today].indexOf(habitId);
  if (idx > -1) {
    completions[today].splice(idx, 1);
  } else {
    completions[today].push(habitId);
  }

  if (completions[today].length === 0) delete completions[today];

  saveCompletions(completions);
  render();
}

// ── Render Stats ───────────────────────────────────────────────
function renderStats(habits, completions) {
  var today       = todayStr();
  var doneToday   = (completions[today] || []).length;
  var totalHabits = habits.length;
  var pct         = totalHabits === 0 ? 0 : Math.round((doneToday / totalHabits) * 100);

  var bestStreak  = 0;
  habits.forEach(function(h) {
    var s = calcStreak(h.id, completions);
    if (s > bestStreak) bestStreak = s;
  });

  document.getElementById('stats-bar').innerHTML =
    '<div class="stat-card"><div class="val">' + doneToday + '/' + totalHabits + '</div><div class="lbl">Today</div></div>' +
    '<div class="stat-card"><div class="val">' + pct + '%</div><div class="lbl">Done</div></div>' +
    '<div class="stat-card"><div class="val">' + bestStreak + '</div><div class="lbl">Best Streak</div></div>';
}

// ── Render Today's Habits ──────────────────────────────────────
function renderTodayList(habits, completions) {
  var container = document.getElementById('today-list');
  var today     = todayStr();
  var doneIds   = completions[today] || [];

  if (habits.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">&#127807;</div>' +
        '<p>No habits yet. Add one above to get started!</p>' +
      '</div>';
    return;
  }

  var html = '';
  habits.forEach(function(habit) {
    var isDone  = doneIds.indexOf(habit.id) > -1;
    var streak  = calcStreak(habit.id, completions);
    var streakLabel = streak > 0 ? '&#128293; ' + streak + ' day' + (streak > 1 ? 's' : '') : '';

    html +=
      '<div class="habit-item ' + (isDone ? 'done' : '') + '" onclick="toggleCompletion(\'' + habit.id + '\')">' +
        '<div class="checkbox">' + (isDone ? '&#10003;' : '') + '</div>' +
        '<div class="habit-name">' + escHtml(habit.name) + '</div>' +
        (streakLabel ? '<div class="streak-badge">' + streakLabel + '</div>' : '') +
        '<button class="del-btn" title="Delete habit" onclick="event.stopPropagation(); deleteHabit(\'' + habit.id + '\')">&#10005;</button>' +
      '</div>';
  });

  container.innerHTML = html;
}

// ── Render Calendar ────────────────────────────────────────────
var DAYS_SHORT = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

function dayClass(dateStr, habits, completions, isCurrentMonth) {
  var today        = todayStr();
  var doneCount    = (completions[dateStr] || []).length;
  var totalHabits  = habits.length;
  var cls          = 'cal-cell';

  if (!isCurrentMonth) return cls + ' off-month';
  if (dateStr === today) return cls + ' today';
  if (totalHabits > 0 && doneCount === totalHabits) return cls + ' all-done';
  if (doneCount > 0) return cls + ' partial';
  return cls;
}

function renderWeekly(habits, completions) {
  var headRow = DAYS_SHORT.map(function(d) {
    return '<div class="cal-head">' + d + '</div>';
  }).join('');

  // last 7 days, aligned into a 7-col grid
  var cells = '';
  for (var i = 6; i >= 0; i--) {
    var d   = dateOffset(-i);
    var ds  = dateToStr(d);
    var cls = dayClass(ds, habits, completions, true);
    cells  += '<div class="' + cls + '">' + d.getDate() + '</div>';
  }

  document.getElementById('cal-view').innerHTML =
    '<div class="cal-grid">' + headRow + cells + '</div>';
}

function renderMonthly(habits, completions) {
  var now       = new Date();
  var firstDay  = new Date(now.getFullYear(), now.getMonth(), 1);
  var lastDay   = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  var startDOW  = firstDay.getDay(); // 0=Sun

  var headRow = DAYS_SHORT.map(function(d) {
    return '<div class="cal-head">' + d + '</div>';
  }).join('');

  var cells = '';

  // Leading blank cells for days before the 1st
  for (var b = 0; b < startDOW; b++) {
    cells += '<div class="cal-cell off-month"></div>';
  }

  // Each day of the month
  for (var day = 1; day <= lastDay.getDate(); day++) {
    var d   = new Date(now.getFullYear(), now.getMonth(), day);
    var ds  = dateToStr(d);
    var cls = dayClass(ds, habits, completions, true);
    cells  += '<div class="' + cls + '">' + day + '</div>';
  }

  // Trailing blank cells to complete the last row
  var total = startDOW + lastDay.getDate();
  var trailing = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (var t = 0; t < trailing; t++) {
    cells += '<div class="cal-cell off-month"></div>';
  }

  document.getElementById('cal-view').innerHTML =
    '<div class="cal-grid">' + headRow + cells + '</div>';
}

// ── Render All Habits + Streaks ────────────────────────────────
function renderAllHabits(habits, completions) {
  var container = document.getElementById('all-list');

  if (habits.length === 0) {
    container.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-icon">&#10024;</div>' +
        '<p>Your habit list is empty.</p>' +
      '</div>';
    return;
  }

  var html = '';
  habits.forEach(function(habit) {
    var streak = calcStreak(habit.id, completions);
    html +=
      '<div class="all-habit-row">' +
        '<div class="name">' + escHtml(habit.name) + '</div>' +
        '<div class="streak-info">' +
          (streak > 0 ? '&#128293; ' + streak + ' day streak' : '&#8212; No streak') +
        '</div>' +
        '<button class="del-btn" title="Delete habit" onclick="deleteHabit(\'' + habit.id + '\')">&#10005;</button>' +
      '</div>';
  });

  container.innerHTML = html;
}

// ── Switch Tab ─────────────────────────────────────────────────
function switchTab(tabName, btn) {
  activeTab = tabName;

  // Update button states
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tabName);
  });

  var habits      = loadHabits();
  var completions = loadCompletions();

  if (tabName === 'weekly') {
    renderWeekly(habits, completions);
  } else {
    renderMonthly(habits, completions);
  }
}

// ── Main Render ────────────────────────────────────────────────
function render() {
  var habits      = loadHabits();
  var completions = loadCompletions();

  // Header date
  document.getElementById('header-date').textContent = formatFull(new Date());

  renderStats(habits, completions);
  renderTodayList(habits, completions);
  renderAllHabits(habits, completions);

  if (activeTab === 'weekly') {
    renderWeekly(habits, completions);
  } else {
    renderMonthly(habits, completions);
  }
}

// ── Keyboard shortcut ─────────────────────────────────────────
document.getElementById('habit-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addHabit();
});
document.getElementById('add-btn').addEventListener('click', addHabit);

// ── Prune old completion data (>90 days) to keep storage lean ─
function pruneOldCompletions() {
  try {
    var completions = loadCompletions();
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);
    var cutoffStr = dateToStr(cutoff);
    var changed = false;

    Object.keys(completions).forEach(function(ds) {
      if (ds < cutoffStr) {
        delete completions[ds];
        changed = true;
      }
    });

    if (changed) saveCompletions(completions);
  } catch(e) { /* non-critical */ }
}

// ── Bootstrap ─────────────────────────────────────────────────
pruneOldCompletions();
render();
</script>
</body>
</html>
